global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Prometheus Server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Web Application Quan Ly Sinh Vien (Node.js + prom-client)
  - job_name: 'qlsv_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          app: 'quanlysinhvien'
          env: 'production'

  # 3. MySQL Exporter (Giam sat Database MySQL)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          service: 'database'
          role: 'mysql-primary'

  # 4. Node Exporter (Giam sat tai nguyen Host / OS)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          role: 'system-monitor'

  # 5. cAdvisor (Giam sat Container Docker)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          role: 'container-metrics'
